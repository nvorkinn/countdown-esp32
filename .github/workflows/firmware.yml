name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and gcovr
        run: pip install --upgrade platformio gcovr

      - name: Run unit tests
        run: pio test -e native

      - name: Measure coverage
        run: >
          gcovr --root . --filter lib/ --exclude-throw-branches --exclude-unreachable-branches
          --print-summary --xml coverage.xml --fail-under-line 95 .pio/build/native

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: countdown-esp32
          disable_search: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e esp-wrover-kit

      - name: Size report
        if: always()
        run: |
          T=$(ls -d ~/.platformio/packages/toolchain-xtensa-esp*/bin)
          ls $T | grep -E 'nm|size' | head
          E=.pio/build/esp-wrover-kit/firmware.elf
          ls -la $E firmware.map || true
          echo "== size -A =="; $T/xtensa-esp32-elf-size -A $E 2>/dev/null | head -30 || $T/xtensa-esp-elf-size -A $E | head -30
          echo "== nm top 80 =="; ($T/xtensa-esp32-elf-nm --size-sort --demangle --radix=d $E || $T/xtensa-esp-elf-nm --size-sort --demangle --radix=d $E) | tail -80 | cut -c1-110
          echo "== map =="
          python3 scripts/size_report.py firmware.map libUpdate.a libHTTPClient.a libWebServer.a libWiFiManager.a libFrameworkArduino.a libmbedtls.a libmbedcrypto.a libesp_https_ota.a libbt.a libhttp_parser.a | cut -c1-200
          mkdir -p ../x; cp firmware.map ../x/ || true

      - name: Collect binaries
        run: |
          mkdir -p dist
          ref="${GITHUB_REF_NAME//\//-}"
          for dir in .pio/build/*/; do
            env=$(basename "$dir")
            cp "$dir/firmware.bin" "dist/countdown-esp32-${env}-${ref}.bin"
            cp "$dir/firmware-merged.bin" "dist/countdown-esp32-${env}-${ref}-merged.bin"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.bin
          if-no-files-found: error
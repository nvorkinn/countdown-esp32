name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and gcovr
        run: pip install --upgrade platformio gcovr

      - name: Run unit tests
        run: pio test -e native

      - name: Measure coverage
        run: >
          gcovr --root . --filter lib/ --exclude-throw-branches --exclude-unreachable-branches
          --print-summary --xml coverage.xml --fail-under-line 95 .pio/build/native

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: countdown-esp32
          disable_search: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e esp-wrover-kit || true

      - name: Size report 8.0.0
        if: always()
        run: |
          find . -name 'firmware.map' -not -path './.git/*' | head
          M=$(find . -name 'firmware.map' -not -path './.git/*' | head -1)
          cp $M /tmp/map800.txt
          python3 scripts/size_report.py /tmp/map800.txt libUpdate.a libHTTPClient.a libWebServer.a libWiFiManager.a libFrameworkArduino.a libmbedtls.a libmbedcrypto.a libesp_https_ota.a libbt.a libhttp_parser.a libmdns.a libesp_https_server.a libesp_http_server.a | cut -c1-160

      - name: Build 7.1.3
        if: always()
        run: |
          find . -name 'firmware.map' -not -path './.git/*' -delete
          rm -rf .pio/build
          sed -i 's/espressif32@8.0.0/espressif32@7.1.3/' platformio.ini
          pio run -e esp-wrover-kit || true

      - name: Size report 7.1.3
        if: always()
        run: |
          M=$(find . -name 'firmware.map' -not -path './.git/*' | head -1)
          cp $M /tmp/map713.txt
          python3 scripts/size_report.py /tmp/map713.txt | cut -c1-160

      - name: Compare
        if: always()
        run: python3 scripts/size_report.py --diff map800.txt map713.txt | cut -c1-160

      - name: Collect binaries
        run: |
          mkdir -p dist
          ref="${GITHUB_REF_NAME//\//-}"
          for dir in .pio/build/*/; do
            env=$(basename "$dir")
            cp "$dir/firmware.bin" "dist/countdown-esp32-${env}-${ref}.bin"
            cp "$dir/firmware-merged.bin" "dist/countdown-esp32-${env}-${ref}-merged.bin"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/*.bin
          if-no-files-found: error
name: Release

# Releasing is tagging: push a v* tag on a commit of main, or press "Run workflow" (Actions > Release) to have the next
# tag made on the head of main. Either way the tests run, every panel is built for both servers (prod and dev), and
# a GitHub pre-release holds the binaries. Boards are flashed by USB, so there is nothing to deploy: promoting a build
# means flashing the other server's binary (see "Releases" in the README).
on:
  push:
    tags: ["v*"]
  # Tags the head of main with the next version after the latest v* tag, then releases it in this same run. A tag
  # pushed with the workflow's own token starts no second run.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

# One release at a time; a second waits rather than racing the first for the tag or the release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      # To create the tag on a button release.
      contents: write
    outputs:
      value: ${{ steps.tag.outputs.value }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Work out the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "Release from main, not $GITHUB_REF" >&2; exit 1; }
            latest="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate --jq '.[].ref' \
              | sed 's#refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
            IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
            major="${major#v}"
            case "$BUMP" in
              major) tag="v$((major + 1)).0.0" ;;
              minor) tag="v$major.$((minor + 1)).0" ;;
              *) tag="v$major.$minor.$((patch + 1))" ;;
            esac
            echo "Next tag: $tag (after ${latest:-no tag})"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # The tag names files and is passed to the shell in later jobs, so keep it to safe characters.
          [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || { echo "Unsupported tag: $tag" >&2; exit 1; }
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      # Only what has been through main's checks is released. The commit is an ancestor of main (or main's head) when
      # GitHub calls it "behind" (or "identical to") main.
      - name: Check that the commit is on main
        run: |
          status="$(gh api "repos/$GH_REPO/compare/main...$GITHUB_SHA" --jq .status)"
          case "$status" in
            identical | behind) echo "$GITHUB_SHA is on main ($status)" ;;
            *) echo "$GITHUB_SHA is not on main ($status): release a commit of main" >&2; exit 1 ;;
          esac

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          # Fails if the tag already exists, e.g. two releases started at once.
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          echo "Tagged $GITHUB_SHA as $TAG"

  # The native tests, then each panel built for each server (firmware.yml), its binaries named with the tag. The
  # tag job comes first so nothing is built from a commit that isn't on main.
  firmware:
    needs: tag
    uses: ./.github/workflows/firmware.yml
    with:
      version: ${{ needs.tag.outputs.value }}

  publish:
    needs: [tag, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.value }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # firmware-prod and firmware-dev, side by side in dist/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: Create the release
        run: |
          cd dist
          sha256sum -- *.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Firmware for the ESP32 e-paper countdown boards, one build per panel and server.

          - \`-prod-\` files talk to the production server, \`-dev-\` files to the dev/QA server.
          - \`-merged.bin\` is the standalone image to flash at \`0x0\` (a fresh install: it erases the board's saved Wi-Fi and device secret). The other file is the application only.
          - Flashing a board with the other server's build points it at that server. See [Flashing without PlatformIO](https://github.com/$GH_REPO#flashing-without-platformio).
          - Check a download against \`SHA256SUMS.txt\`.

          EOF
          # Re-running a release that was only half published adds to it rather than failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" *.bin SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" --verify-tag --prerelease --title "$TAG" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes *.bin SHA256SUMS.txt
          fi

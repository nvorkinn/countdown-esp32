; PlatformIO project configuration for the countdown ESP32 firmware.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp-wrover-kit

[env]
monitor_speed = 115200
build_flags = -Wall

[esp32]
; Pinned so a new platform release can't break the build unannounced (8.0.0, Arduino core 3.x, did: it removed
; mbedtls_sha256_ret and changed RequestHandler's canHandle/handle). src/wifi_setup.cpp is written for core 2.x
; (7.1.3) and 3.x (8.0.0); to move to a newer platform, change this and check the captive portal on a board.
platform = espressif32@8.0.0
board = esp-wrover-kit
framework = arduino
board_build.partitions = huge_app.csv
lib_deps =
    tzapu/WiFiManager@^2.0.17
; The core's default is gnu++11; lib/broker_client needs C++17 (std::optional).
; Exceptions let the HTTP receiver report allocation failures instead of rebooting.
build_unflags = -std=gnu++11 -fno-exceptions
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -fexceptions
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Wl,-Map,${PROJECT_DIR}/firmware.map
    -Wl,--cref
    '-DBROKER_URL="https://auth.nikolaivorkinn.com"'
extra_scripts = post:scripts/merge_firmware.py

[env:esp-wrover-kit]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DEPD_PANEL_7IN5_V2
    ; The e-Paper HAT's wiring: see "Connecting the e-paper panel" in the README. PWR -1: no PWR wire.
    -DEPD_PIN_DIN=14
    -DEPD_PIN_CLK=13
    -DEPD_PIN_CS=15
    -DEPD_PIN_DC=33
    -DEPD_PIN_RST=26
    -DEPD_PIN_BUSY=25
    -DEPD_PIN_PWR=32

[env:esp-wrover-kit-it8951]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DEPD_PANEL_IT8951
    -DEPD_PIN_DIN=14
    -DEPD_PIN_MISO=34
    -DEPD_PIN_CLK=13
    -DEPD_PIN_CS=15
    -DEPD_PIN_DC=-1
    -DEPD_PIN_RST=26
    -DEPD_PIN_BUSY=25
    -DEPD_PIN_PWR=-1

; The host-side unit tests for lib/broker_client and lib/epd, with coverage: `pio test -e native`.
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Wextra
    -std=c++17
    --coverage
extra_scripts = post:scripts/link_coverage.py

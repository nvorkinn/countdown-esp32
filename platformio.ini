; PlatformIO project configuration for the countdown ESP32 firmware.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp-wrover-kit

[env]
monitor_speed = 115200
build_flags = -Wall

; The server each build talks to: BROKER_URL, compiled in. There are two server environments, and a board is flashed
; (by USB, there is no OTA) with the build for the one it belongs to. This is the one place the two URLs are set.
;   prod: what a plain `pio run -e esp-wrover-kit` builds, and the default.
;   dev:  the `-dev` environments (esp-wrover-kit-dev, esp-wrover-kit-it8951-dev), and the dev/QA release binaries.
; Each server must serve a Let's Encrypt certificate directly (not behind a CDN or proxy that swaps in another CA):
; the firmware pins only the ISRG roots (src/root_certs.h).
; TODO: dev/QA moves to https://auth.dev.nikolaivorkinn.com once its DNS exists. Until then it shares the production
; server, so the two values are equal. When it moves, change url_dev here (only here) and flash the dev boards again.
[broker]
url_prod = https://auth.nikolaivorkinn.com
url_dev = https://auth.nikolaivorkinn.com

[esp32]
; Pinned so a new platform release can't break the build unannounced (8.0.0, Arduino core 3.x, did). src/wifi_setup.cpp
; is written for core 2.x (7.1.3) and 3.x (8.0.0). To move to a newer platform, change this, build both environments,
; and check the captive portal, the HTTPS poll and the display on a board.
platform = espressif32@8.0.0
; Core 3.x's firmware is about 1.47 MB, over the default partition table's 1.25 MB app slot. partitions.csv is the core's
; huge_app.csv (a 3 MB app slot, and no second one for OTA, which this firmware doesn't use) with 384 KB of its SPIFFS
; given to a `setup` partition, for the set-up screen provision/provision.py writes. NVS stays where it was (0x9000), but
; the table is in flash, so a board needs its new table written once: flash the merged image (see "Flashing without
; PlatformIO").
board_build.partitions = partitions.csv
board = esp-wrover-kit
framework = arduino
lib_deps =
    tzapu/WiFiManager@^2.0.17
; The core's default is gnu++11; lib/broker_client needs C++17 (std::optional).
; Exceptions let the HTTP receiver report allocation failures instead of rebooting.
build_unflags = -std=gnu++11 -fno-exceptions
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -fexceptions
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
; No BROKER_URL here: each environment below sets it exactly once, from [broker], so the dev and prod environments
; can share their panel's flags without defining the macro twice.
extra_scripts = post:scripts/merge_firmware.py

; The two panels' wiring. Shared by the production and dev environments of each (see below).
[panel_7in5_v2]
build_flags =
    -DEPD_PANEL_7IN5_V2
    ; The e-Paper HAT's wiring: see "Connecting the e-paper panel" in the README. PWR -1: no PWR wire.
    -DEPD_PIN_DIN=14
    -DEPD_PIN_CLK=13
    -DEPD_PIN_CS=15
    -DEPD_PIN_DC=33
    -DEPD_PIN_RST=26
    -DEPD_PIN_BUSY=25
    -DEPD_PIN_PWR=32

[panel_it8951]
build_flags =
    -DEPD_PANEL_IT8951
    -DEPD_PIN_DIN=14
    -DEPD_PIN_MISO=34
    -DEPD_PIN_CLK=13
    -DEPD_PIN_CS=15
    -DEPD_PIN_DC=-1
    -DEPD_PIN_RST=26
    -DEPD_PIN_BUSY=25
    -DEPD_PIN_PWR=-1

; One environment per panel and server: the panel's name is the production build (the original names, so
; `pio run -e esp-wrover-kit` is unchanged), and `-dev` is the same board built for the dev/QA server.
[env:esp-wrover-kit]
extends = esp32
build_flags =
    ${esp32.build_flags}
    ${panel_7in5_v2.build_flags}
    '-DBROKER_URL="${broker.url_prod}"'

[env:esp-wrover-kit-dev]
extends = esp32
build_flags =
    ${esp32.build_flags}
    ${panel_7in5_v2.build_flags}
    '-DBROKER_URL="${broker.url_dev}"'

[env:esp-wrover-kit-it8951]
extends = esp32
build_flags =
    ${esp32.build_flags}
    ${panel_it8951.build_flags}
    '-DBROKER_URL="${broker.url_prod}"'

[env:esp-wrover-kit-it8951-dev]
extends = esp32
build_flags =
    ${esp32.build_flags}
    ${panel_it8951.build_flags}
    '-DBROKER_URL="${broker.url_dev}"'

; The host-side unit tests for lib/broker_client and lib/epd, with coverage: `pio test -e native`.
[env:native]
platform = native
test_framework = unity
build_flags =
    ${env.build_flags}
    -Wextra
    -std=c++17
    --coverage
extra_scripts = post:scripts/link_coverage.py
